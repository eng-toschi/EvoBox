; EvoBox — ver docs/SPEC.md §9.5
[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
; os testes rodam só em native (sem hardware); a placa é testada em bancada
test_ignore = *

[env:esp32dev-sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DGA_SIM=1

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -DFIXTURE_DIR=\"${PROJECT_DIR}/test/fixtures\"
